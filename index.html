<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz de Farmacologia - Trajetória</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn-bg: #334155;
      --btn-hover: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 600px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .step-indicator { display: flex; gap: 8px; }
    .step-dot { width: 32px; height: 32px; border-radius: 50%; background: #334155; color: var(--subtext); display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: bold; transition: all 0.3s; }
    .step-dot.active { background: var(--accent); color: #0f172a; transform: scale(1.1); }
    .step-dot.completed { background: var(--correct); color: white; }

    .drug-name { font-size: 2rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-transform: capitalize; }
    .prompt-label { font-size: 1.05rem; color: var(--text); margin-bottom: 18px; }
    .prompt-target { font-weight: bold; color: #facc15; }

    .breadcrumbs { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; color: var(--subtext); line-height: 1.5; }
    .breadcrumbs strong { color: var(--text); }

    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-option { background-color: var(--btn-bg); border: 2px solid transparent; color: var(--text); padding: 13px 16px; border-radius: 10px; font-size: 0.98rem; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn-option:hover:not(:disabled) { background-color: var(--btn-hover); transform: translateY(-1px); }
    .btn-option:disabled { cursor: default; }
    
    .btn-option.correct { background-color: var(--correct); color: white; border-color: var(--correct); }
    .btn-option.wrong { background-color: var(--wrong); color: white; border-color: var(--wrong); }
    
    .feedback-box { margin-bottom: 18px; padding: 14px; border-radius: 8px; background: #0f172a; display: none; font-size: 0.95rem; line-height: 1.4; }
    
    .actions { display: flex; justify-content: flex-end; }
    .btn-next { background-color: var(--accent); color: #0f172a; border: none; padding: 12px 22px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; display: none; }
    .btn-next:hover { opacity: 0.9; }

    .score-banner { text-align: center; margin-top: 18px; font-size: 0.9rem; color: var(--subtext); border-top: 1px solid #334155; padding-top: 12px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <span style="font-size: 0.9rem; color: var(--subtext);" id="drug-counter">Fármaco em estudo</span>
      <div class="step-indicator">
        <div class="step-dot active" id="dot-0" title="Grupo Principal">1</div>
        <div class="step-dot" id="dot-1" title="Subgrupo">2</div>
        <div class="step-dot" id="dot-2" title="Subsubgrupo">3</div>
      </div>
    </div>

    <div class="drug-name" id="drug-name">...</div>
    <div class="prompt-label">Passo: selecione o <span class="prompt-target" id="prompt-target">Grupo Principal</span></div>

    <!-- Caminho já percorrido -->
    <div class="breadcrumbs" id="breadcrumbs">
      Trajetória: <span id="trail-text">A iniciar...</span>
    </div>

    <div class="options" id="options-container"></div>

    <div class="feedback-box" id="feedback-box"></div>

    <div class="actions">
      <button class="btn-next" id="btn-action" onclick="advanceTrajectory()">Avançar</button>
    </div>

    <div class="score-banner" id="score-tracker">Medicamentos concluídos: 0</div>
  </div>

  <script>
    /* ==========================================================
       BASE DE DADOS DE MEDICAMENTOS (Substituímos pelas tuas folhas)
       ========================================================== */
    const pharmaData = [
      {
        drug: "Amoxicilina",
        grupo: "Anti-infeciosos",
        subgrupo: "Antibacterianos",
        subsubgrupo: "Penicilinas"
      },
      {
        drug: "Ciprofloxacina",
        grupo: "Anti-infeciosos",
        subgrupo: "Antibacterianos",
        subsubgrupo: "Fluoroquinolonas"
      },
      {
        drug: "Omeprazol",
        grupo: "Aparelho Digestivo",
        subgrupo: "Antiácidos e Antiulcerosos",
        subsubgrupo: "Inibidores da Bomba de Protões (IBP)"
      },
      {
        drug: "Ibuprofeno",
        grupo: "Sistema Nervoso Central e Dor",
        subgrupo: "Anti-inflamatórios e Antirreumáticos",
        subsubgrupo: "AINEs (Derivados do Ácido Propiónico)"
      },
      {
        drug: "Metformina",
        grupo: "Aparelho Hormonal e Metabolismo",
        subgrupo: "Antidiabéticos",
        subsubgrupo: "Biguanidas"
      },
      {
        drug: "Atorvastatina",
        grupo: "Aparelho Cardiovascular",
        subgrupo: "Hipolipemiantes",
        subsubgrupo: "Estatinas"
      },
      {
        drug: "Salbutamol",
        grupo: "Aparelho Respiratório",
        subgrupo: "Antiasmáticos e Broncodilatadores",
        subsubgrupo: "Agonistas Beta-2 Adrenérgicos"
      },
      {
        drug: "Diazepam",
        grupo: "Sistema Nervoso Central",
        subgrupo: "Psicofármacos",
        subsubgrupo: "Benzodiazepinas"
      }
    ];

    // Os 3 passos da trajetória
    const steps = [
      { key: "grupo", label: "Grupo Principal" },
      { key: "subgrupo", label: "Subgrupo" },
      { key: "subsubgrupo", label: "Subsubgrupo / Família" }
    ];

    let currentDrug = null;
    let currentStepIndex = 0; // 0 = Grupo, 1 = Subgrupo, 2 = Subsubgrupo
    let completedCount = 0;
    let isStepSuccess = false;

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function getRandomDrug() {
      return pharmaData[Math.floor(Math.random() * pharmaData.length)];
    }

    function getUniqueDistractors(correctVal, key) {
      const allVals = [...new Set(pharmaData.map(item => item[key]))].filter(val => val !== correctVal);
      const shuffled = shuffle(allVals);
      return shuffled.slice(0, 3);
    }

    function updateDots() {
      for (let i = 0; i < 3; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = "step-dot";
        if (i < currentStepIndex) {
          dot.classList.add("completed");
        } else if (i === currentStepIndex) {
          dot.classList.add("active");
        }
      }
    }

    function updateTrail() {
      let parts = [];
      if (currentStepIndex > 0) parts.push(`<strong>Grupo:</strong> ${currentDrug.grupo}`);
      if (currentStepIndex > 1) parts.push(`<strong>Subgrupo:</strong> ${currentDrug.subgrupo}`);
      if (currentStepIndex > 2) parts.push(`<strong>Família:</strong> ${currentDrug.subsubgrupo}`);

      document.getElementById("trail-text").innerHTML = parts.length > 0 ? parts.join(" &rarr; ") : "A iniciar no Grupo Principal";
    }

    function startNewDrug() {
      currentDrug = getRandomDrug();
      currentStepIndex = 0;
      loadStep();
    }

    function loadStep() {
      isStepSuccess = false;
      updateDots();
      updateTrail();

      const currentStep = steps[currentStepIndex];
      document.getElementById("drug-name").textContent = currentDrug.drug;
      document.getElementById("prompt-target").textContent = currentStep.label;

      const feedbackBox = document.getElementById("feedback-box");
      const btnAction = document.getElementById("btn-action");
      feedbackBox.style.display = "none";
      btnAction.style.display = "none";

      const correctAnswer = currentDrug[currentStep.key];
      const distractors = getUniqueDistractors(correctAnswer, currentStep.key);
      const options = shuffle([correctAnswer, ...distractors]);

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      options.forEach(text => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = text;
        btn.onclick = () => handleAnswer(btn, text, correctAnswer);
        container.appendChild(btn);
      });
    }

    function handleAnswer(clickedBtn, selectedVal, correctVal) {
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(b => {
        b.disabled = true;
        if (b.textContent === correctVal) b.classList.add("correct");
      });

      const feedbackBox = document.getElementById("feedback-box");
      const btnAction = document.getElementById("btn-action");
      feedbackBox.style.display = "block";

      if (selectedVal === correctVal) {
        isStepSuccess = true;
        if (currentStepIndex < 2) {
          feedbackBox.innerHTML = `<strong>✅ Certo!</strong> Excelente. Agora vamos descer para o próximo nível.`;
          btnAction.textContent = "Continuar Trajetória &rarr;";
        } else {
          // Chegou ao fim do 3º nível com sucesso!
          completedCount++;
          document.getElementById(`dot-2`).className = "step-dot completed";
          feedbackBox.innerHTML = `<strong>🎉 Trajetória Completa!</strong> Identificaste toda a hierarquia de <strong>${currentDrug.drug}</strong>:<br>
          ${currentDrug.grupo} &rarr; ${currentDrug.subgrupo} &rarr; ${currentDrug.subsubgrupo}`;
          btnAction.textContent = "Próximo Medicamento &rarr;";
          document.getElementById("score-tracker").textContent = `Medicamentos concluídos: ${completedCount}`;
        }
      } else {
        isStepSuccess = false;
        clickedBtn.classList.add("wrong");
        feedbackBox.innerHTML = `<strong>❌ Incorreto!</strong><br>
        O <strong>${steps[currentStepIndex].label}</strong> correto de <strong>${currentDrug.drug}</strong> é <em>${correctVal}</em>.<br><br>
        <span style="color:var(--subtext)">Hierarquia completa: ${currentDrug.grupo} &rarr; ${currentDrug.subgrupo} &rarr; ${currentDrug.subsubgrupo}</span>`;
        btnAction.textContent = "Tentar Outro Medicamento &rarr;";
      }

      btnAction.style.display = "inline-block";
    }

    function advanceTrajectory() {
      if (isStepSuccess) {
        if (currentStepIndex < 2) {
          currentStepIndex++;
          loadStep();
        } else {
          startNewDrug();
        }
      } else {
        // Se errou, passa para um novo medicamento
        startNewDrug();
      }
    }

    // Iniciar a aplicação
    startNewDrug();
  </script>
</body>
</html>
