<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz de Farmacologia - Trajetória</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn-bg: #334155;
      --btn-hover: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 620px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    
    .top-bar { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
    .top-title { font-size: 0.85rem; color: var(--subtext); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    
    .step-indicator { display: flex; gap: 8px; flex-wrap: wrap; }
    .step-pill { 
      padding: 6px 14px; 
      border-radius: 20px; 
      background: #334155; 
      color: var(--subtext); 
      font-size: 0.82rem; 
      font-weight: 600; 
      transition: all 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .step-pill.active { 
      background: var(--accent); 
      color: #0f172a; 
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .step-pill.completed { 
      background: var(--correct); 
      color: white; 
    }

    .drug-name { font-size: 1.85rem; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-transform: capitalize; line-height: 1.25; }
    .prompt-label { font-size: 1.05rem; color: var(--text); margin-bottom: 16px; }
    .prompt-target { font-weight: bold; color: #facc15; }

    .breadcrumbs { background: #0f172a; padding: 10px 14px; border-radius: 8px; margin-bottom: 20px; font-size: 0.85rem; color: var(--subtext); line-height: 1.5; }
    .breadcrumbs strong { color: var(--text); }

    .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .btn-option { background-color: var(--btn-bg); border: 2px solid transparent; color: var(--text); padding: 14px 16px; border-radius: 10px; font-size: 0.98rem; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn-option:hover:not(:disabled) { background-color: var(--btn-hover); transform: translateY(-1px); }
    .btn-option:disabled { cursor: default; }
    
    .btn-option.correct { background-color: var(--correct); color: white; border-color: var(--correct); }
    .btn-option.wrong { background-color: var(--wrong); color: white; border-color: var(--wrong); }
    
    .feedback-box { margin-bottom: 18px; padding: 14px; border-radius: 8px; background: #0f172a; display: none; font-size: 0.95rem; line-height: 1.5; }
    
    .actions { display: flex; justify-content: flex-end; }
    .btn-next { background-color: var(--accent); color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; display: none; }
    .btn-next:hover { opacity: 0.9; }

    .score-banner { text-align: center; margin-top: 18px; font-size: 0.9rem; color: var(--subtext); border-top: 1px solid #334155; padding-top: 12px; }
    .error-msg { background: #7f1d1d; color: #fecaca; padding: 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.4; }
  </style>
</head>
<body>

  <div class="container" id="app-container">
    <div class="top-bar">
      <div class="top-title">Sequência Farmacológica</div>
      <div class="step-indicator">
        <div class="step-pill active" id="pill-0">Grupo Principal</div>
        <div class="step-pill" id="pill-1">Subgrupo</div>
        <div class="step-pill" id="pill-2">Subsubgrupo</div>
      </div>
    </div>

    <div class="drug-name" id="drug-name">A carregar...</div>
    <div class="prompt-label">Passo: seleciona o <span class="prompt-target" id="prompt-target">Grupo Principal</span></div>

    <div class="breadcrumbs" id="breadcrumbs">
      Sequência: <span id="trail-text">A iniciar...</span>
    </div>

    <div class="options" id="options-container"></div>

    <div class="feedback-box" id="feedback-box"></div>

    <div class="actions">
      <button class="btn-next" id="btn-action" onclick="advanceTrajectory()">Avançar</button>
    </div>

    <div class="score-banner" id="score-tracker">Medicamentos completados com sucesso: 0</div>
  </div>

  <!-- Carrega os dados de forma direta e sem bloqueios -->
  <script src="medicamentos.js"></script>

  <script>
    if (typeof pharmaData === "undefined" || !Array.isArray(pharmaData) || pharmaData.length === 0) {
      document.getElementById("app-container").innerHTML = `
        <div class="error-msg">
          <strong>Ficheiro medicamentos.js não encontrado!</strong><br><br>
          Certifica-te de que criaste o ficheiro <code>medicamentos.js</code> com a variável <code>const pharmaData = [...]</code> na mesma pasta.
        </div>
      `;
      throw new Error("pharmaData não carregado.");
    }

    const steps = [
      { key: "grupo", label: "Grupo Principal" },
      { key: "subgrupo", label: "Subgrupo" },
      { key: "subsubgrupo", label: "Subsubgrupo" }
    ];

    let currentDrug = null;
    let currentStepIndex = 0;
    let completedCount = 0;
    let isStepSuccess = false;

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function selectNewDrug() {
      let nextDrug = pharmaData[Math.floor(Math.random() * pharmaData.length)];
      if (pharmaData.length > 1 && currentDrug && nextDrug.drug === currentDrug.drug) {
        return selectNewDrug();
      }
      return nextDrug;
    }

    function get3Distractors(correctVal, key) {
      const allVals = [...new Set(pharmaData.map(item => item[key]))].filter(val => val && val !== correctVal);
      const shuffled = shuffle(allVals);
      return shuffled.slice(0, 3);
    }

    function updateStepPills() {
      for (let i = 0; i < 3; i++) {
        const pill = document.getElementById(`pill-${i}`);
        const baseName = steps[i].label;
        pill.className = "step-pill";

        if (i < currentStepIndex) {
          pill.classList.add("completed");
          pill.innerHTML = `✓ ${baseName}`;
        } else if (i === currentStepIndex) {
          pill.classList.add("active");
          pill.textContent = baseName;
        } else {
          pill.textContent = baseName;
        }
      }
    }

    function updateTrail() {
      let parts = [];
      if (currentStepIndex > 0) parts.push(`<strong>Grupo:</strong> ${currentDrug.grupo}`);
      if (currentStepIndex > 1) parts.push(`<strong>Subgrupo:</strong> ${currentDrug.subgrupo}`);
      if (currentStepIndex > 2) parts.push(`<strong>Subsubgrupo:</strong> ${currentDrug.subsubgrupo}`);

      document.getElementById("trail-text").innerHTML = parts.length > 0 
        ? parts.join(" &rarr; ") 
        : "A iniciar no Grupo Principal";
    }

    function startWithNewDrug() {
      currentDrug = selectNewDrug();
      currentStepIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      isStepSuccess = false;
      updateStepPills();
      updateTrail();

      const step = steps[currentStepIndex];
      document.getElementById("drug-name").textContent = currentDrug.drug;
      document.getElementById("prompt-target").textContent = step.label;

      const feedbackBox = document.getElementById("feedback-box");
      const btnAction = document.getElementById("btn-action");
      feedbackBox.style.display = "none";
      btnAction.style.display = "none";

      const correctAnswer = currentDrug[step.key];
      const distractors = get3Distractors(correctAnswer, step.key);
      const options = shuffle([correctAnswer, ...distractors]);

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      options.forEach(optionText => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = optionText;
        btn.onclick = () => handleAnswer(btn, optionText, correctAnswer);
        container.appendChild(btn);
      });
    }

    function handleAnswer(clickedBtn, selectedAnswer, correctAnswer) {
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(b => {
        b.disabled = true;
        if (b.textContent === correctAnswer) b.classList.add("correct");
      });

      const feedbackBox = document.getElementById("feedback-box");
      const btnAction = document.getElementById("btn-action");
      feedbackBox.style.display = "block";

      if (selectedAnswer === correctAnswer) {
        isStepSuccess = true;
        if (currentStepIndex < 2) {
          const nextStepLabel = steps[currentStepIndex + 1].label;
          feedbackBox.innerHTML = `<strong>✅ Correto!</strong><br>Excelente. Agora escolhe o <strong>${nextStepLabel}</strong> de <strong>${currentDrug.drug}</strong>.`;
          btnAction.textContent = `Avançar para o ${nextStepLabel} →`;
        } else {
          completedCount++;
          document.getElementById("pill-2").classList.add("completed");
          document.getElementById("pill-2").innerHTML = `✓ ${steps[2].label}`;
          feedbackBox.innerHTML = `<strong>🎉 Sequência Completa!</strong><br>Identificaste com sucesso toda a hierarquia de <strong>${currentDrug.drug}</strong>:<br>
          ${currentDrug.grupo} &rarr; ${currentDrug.subgrupo} &rarr; ${currentDrug.subsubgrupo}`;
          btnAction.textContent = "Próximo Medicamento →";
          document.getElementById("score-tracker").textContent = `Medicamentos completados com sucesso: ${completedCount}`;
        }
      } else {
        isStepSuccess = false;
        clickedBtn.classList.add("wrong");
        feedbackBox.innerHTML = `<strong>❌ Errado!</strong><br>
        O <strong>${steps[currentStepIndex].label}</strong> correto de <strong>${currentDrug.drug}</strong> é <em>${correctAnswer}</em>.<br><br>
        <span style="color:var(--subtext)">Sequência correta: ${currentDrug.grupo} &rarr; ${currentDrug.subgrupo} &rarr; ${currentDrug.subsubgrupo}</span>`;
        btnAction.textContent = "Trocar de Medicamento e Recomeçar →";
      }

      btnAction.style.display = "inline-block";
    }

    function advanceTrajectory() {
      if (isStepSuccess) {
        if (currentStepIndex < 2) {
          currentStepIndex++;
          loadQuestion();
        } else {
          startWithNewDrug();
        }
      } else {
        startWithNewDrug();
      }
    }

    // Arrancar a aplicação
    startWithNewDrug();
  </script>
</body>
</html>
