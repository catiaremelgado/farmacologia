<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz de Farmacologia</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn-bg: #334155;
      --btn-hover: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .container { background-color: var(--card-bg); width: 100%; max-width: 580px; border-radius: 16px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.95rem; color: var(--subtext); }
    .badge { background: #0284c7; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.8rem; }
    
    .question-box { margin-bottom: 24px; }
    .drug-name { font-size: 1.8rem; font-weight: 700; color: var(--accent); margin: 6px 0 12px 0; text-transform: capitalize; }
    .question-prompt { font-size: 1.1rem; color: var(--text); }
    
    .options { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .btn-option { background-color: var(--btn-bg); border: 2px solid transparent; color: var(--text); padding: 14px 18px; border-radius: 10px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; }
    .btn-option:hover:not(:disabled) { background-color: var(--btn-hover); transform: translateY(-1px); }
    .btn-option:disabled { cursor: default; }
    
    .btn-option.correct { background-color: var(--correct); color: white; border-color: var(--correct); }
    .btn-option.wrong { background-color: var(--wrong); color: white; border-color: var(--wrong); }
    
    .feedback { margin-top: 15px; padding: 14px; border-radius: 8px; background: #0f172a; display: none; font-size: 0.95rem; line-height: 1.4; }
    .feedback span { display: block; margin-top: 4px; color: var(--subtext); font-size: 0.85rem; }
    
    .actions { display: flex; justify-content: flex-end; }
    .btn-next { background-color: var(--accent); color: #0f172a; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; font-size: 1rem; cursor: pointer; display: none; }
    .btn-next:hover { opacity: 0.9; }

    .score-banner { text-align: center; margin-top: 15px; font-size: 0.9rem; color: var(--subtext); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span>Pergunta <span id="current-q">1</span></span>
      <span class="badge" id="level-badge">Nível</span>
    </div>

    <div class="question-box">
      <div class="question-prompt">Qual é o <strong id="question-target">...</strong> do medicamento:</div>
      <div class="drug-name" id="drug-name">...</div>
    </div>

    <div class="options" id="options-container"></div>

    <div class="feedback" id="feedback-box"></div>

    <div class="actions">
      <button class="btn-next" id="btn-next" onclick="nextQuestion()">Seguinte &rarr;</button>
    </div>

    <div class="score-banner" id="score-tracker">Pontuação: 0 / 0</div>
  </div>

  <script>
    /* ==========================================================
       BASE DE DADOS DE MEDICAMENTOS (Depois substituímos pelas tuas folhas)
       Formato: [Nome, Grupo Principal, Subgrupo, Subsubgrupo]
       ========================================================== */
    const pharmaData = [
      {
        drug: "Amoxicilina",
        grupo: "Anti-infeciosos",
        subgrupo: "Antibacterianos",
        subsubgrupo: "Penicilinas"
      },
      {
        drug: "Omeprazol",
        grupo: "Aparelho Digestivo",
        subgrupo: "Antiácidos e Antiulcerosos",
        subsubgrupo: "Inibidores da Bomba de Protões (IBP)"
      },
      {
        drug: "Ibuprofeno",
        grupo: "Sistema Nervoso Central e Dor",
        subgrupo: "Anti-inflamatórios e Antirreumáticos",
        subsubgrupo: "AINEs (Derivados do Ácido Propiónico)"
      },
      {
        drug: "Metformina",
        grupo: "Aparelho Hormonal e Metabolismo",
        subgrupo: "Antidiabéticos",
        subsubgrupo: "Biguanidas"
      },
      {
        drug: "Atorvastatina",
        grupo: "Aparelho Cardiovascular",
        subgrupo: "Hipolipemiantes",
        subsubgrupo: "Estatinas"
      },
      {
        drug: "Salbutamol",
        grupo: "Aparelho Respiratório",
        subgrupo: "Antiasmáticos e Broncodilatadores",
        subsubgrupo: "Agonistas Beta-2 Adrenérgicos"
      },
      {
        drug: "Diazepam",
        grupo: "Sistema Nervoso Central",
        subgrupo: "Psicofármacos",
        subsubgrupo: "Benzodiazepinas"
      },
      {
        drug: "Ciprofloxacina",
        grupo: "Anti-infeciosos",
        subgrupo: "Antibacterianos",
        subsubgrupo: "Fluoroquinolonas"
      }
    ];

    const levels = [
      { key: "grupo", label: "Grupo Principal" },
      { key: "subgrupo", label: "Subgrupo Farmacológico" },
      { key: "subsubgrupo", label: "Subsubgrupo / Família" }
    ];

    let currentItem = null;
    let currentLevel = null;
    let score = 0;
    let totalAnswered = 0;

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function getUniqueDistractors(correctAnswer, key) {
      const allValues = [...new Set(pharmaData.map(item => item[key]))].filter(val => val !== correctAnswer);
      const shuffled = shuffle(allValues);
      return shuffled.slice(0, 3);
    }

    function loadQuestion() {
      currentItem = getRandomItem(pharmaData);
      currentLevel = getRandomItem(levels);

      document.getElementById("drug-name").textContent = currentItem.drug;
      document.getElementById("question-target").textContent = currentLevel.label;
      document.getElementById("level-badge").textContent = currentLevel.label;
      document.getElementById("feedback-box").style.display = "none";
      document.getElementById("btn-next").style.display = "none";

      const correctAnswer = currentItem[currentLevel.key];
      const distractors = getUniqueDistractors(correctAnswer, currentLevel.key);
      const options = shuffle([correctAnswer, ...distractors]);

      const container = document.getElementById("options-container");
      container.innerHTML = "";

      options.forEach(optionText => {
        const btn = document.createElement("button");
        btn.className = "btn-option";
        btn.textContent = optionText;
        btn.onclick = () => selectOption(btn, optionText, correctAnswer);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedBtn, selectedAnswer, correctAnswer) {
      const buttons = document.querySelectorAll(".btn-option");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === correctAnswer) {
          btn.classList.add("correct");
        }
      });

      totalAnswered++;
      const isCorrect = (selectedAnswer === correctAnswer);

      if (isCorrect) {
        score++;
      } else {
        selectedBtn.classList.add("wrong");
      }

      // Feedback com hierarquia completa
      const feedback = document.getElementById("feedback-box");
      feedback.style.display = "block";
      feedback.innerHTML = `
        <strong>${isCorrect ? "✅ Correto!" : "❌ Incorreto!"}</strong>
        <span><strong>Hierarquia completa de ${currentItem.drug}:</strong><br>
        • Grupo: ${currentItem.grupo}<br>
        • Subgrupo: ${currentItem.subgrupo}<br>
        • Família: ${currentItem.subsubgrupo}</span>
      `;

      document.getElementById("btn-next").style.display = "inline-block";
      document.getElementById("score-tracker").textContent = `Pontuação: ${score} / ${totalAnswered}`;
    }

    function nextQuestion() {
      loadQuestion();
    }

    // Arrancar com a primeira pergunta
    loadQuestion();
  </script>
</body>
</html>
